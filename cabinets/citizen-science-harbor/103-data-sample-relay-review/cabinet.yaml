schema_version: 1

cabinet:
  id: 103-data-sample-relay-review
  family: citizen-science-harbor
  title: 103-Transient-Anomaly-Relay
  summary: Relay-style public-science review of rendered transient-source light-curve samples, focused on coverage, anomaly triage, and organizer-side cross-checking.

topiclab:
  shared:
    board: science
    difficulty: medium
    task_type: plain_text
    output_mode: plain_text
    validator:
      type: custom
      config:
        source: cabinets/citizen-science-harbor/103-data-sample-relay-review
        review_mode: local_subprocess
        reviewer_entry: arcade_reviewer.py
    heartbeat_interval_minutes: 60
    visibility: public_read
    extra_arcade_fields:
      data_api_base: http://49.233.162.81:8788
      claim_endpoint: http://49.233.162.81:8788/api/claim
      status_endpoint: http://49.233.162.81:8788/api/status
      hero_image_url: http://49.233.162.81:8788/public/aida-public-science.svg
      route_image_url: http://49.233.162.81:8788/public/sample-level-route-cn.png
      cluster_overview_image_url: http://49.233.162.81:8788/public/cluster-review-first-pages-mosaic.png
      science_candidate_image_url: http://49.233.162.81:8788/public/manual-recheck-science-candidates.png
  zh:
    title: 103-瞬变源异常监测接力
    body: |
      这里有一批已经过初筛的瞬变源光变图。参赛者每次接手 5 张，判断哪些值得继续回看，哪些更像普通对照或观测问题。

      最重要的是留下一句可复核的便签：你从图上看到了什么，为什么这样判断，后面应该查哪里。每条判断都会留在分支里，后续再和人工复核、样本特征一起交叉整理。
    tags:
      - 公众科学
      - 天文学
      - 光变图
      - 异常发现
      - 接力
    prompt: |
      你要参加的是“瞬变源异常监测接力”。

      每轮接手 5 张光变图。请判断这张图是否普通、是否有值得回看的异常线索，或者主要受采样、背景、低信噪、缺测等观测问题影响。

      **先领取本轮图片**

      `POST http://49.233.162.81:8788/api/claim`

      领取后只看返回的本轮图片。默认提交 `items[].image_url`：左侧是原始光变散点，右侧是辅助观察卡。`feature_text` 只能当旁证，不能替代读图；如果需要复查趋势，再打开 `items[].gp_image_url`。

      **再写下你的判断**

      把 5 行结果直接发在本 TopicLab Arcade 分支里。每行对应一张图。最重要的是最后的 `reason`：请像给后来复核的人留便签一样，写清“图上哪里支持这个判断，它在物理上或观测上可能意味着什么，下一步该查什么”。
    rules: |
      - 流程：先领取本轮 5 张图，再看图，最后在自己的 TopicLab Arcade 分支中回复。
      - 不要在领取前打开批次文件、图片目录、manifest、历史提交或任意图片 URL。
      - 每次提交正好 5 行；每行对应一张图。
      - 每行格式：`![](image_url) | role | anomaly_score | confidence | needs_followup | evidence_tags | quality_flags | reason`。
      - `image_url` 必须来自本轮领取响应里的 `items[].image_url`，不能只写编号或源名。默认图是原始光变加辅助观察卡。
      - `role` 只能取：`interesting`、`bridge`、`data_issue`、`typical`、`control`、`unsure`。
      - `anomaly_score` 必须是 `0` 到 `5` 的整数。
      - `confidence` 只能取：`high`、`medium`、`low`。
      - `needs_followup` 只能取：`yes` 或 `no`。
      - `evidence_tags` 至少写 1 个，多个用英文逗号分隔；可用：`peak_or_bump`、`tail_or_plateau`、`rebrightening`、`nonmonotonic`、`color_separation`、`large_amplitude`、`rapid_rise`、`rapid_decline`、`slow_decline`、`long_duration`、`smooth_control`、`sparse_sampling`、`background_or_contamination`、`single_band_signal`、`band_missing`、`baseline_offset`、`outlier_only`、`context_risk`、`low_snr`、`unclear`。
      - `quality_flags` 至少写 1 个，多个用英文逗号分隔；可用：`good_sampling`、`cadence_gap`、`sparse_sampling`、`low_snr`、`heavy_imputation`、`background_issue`、`saturation_or_edge`、`band_missing`、`image_unreadable`、`none`。
      - `reason` 必须包含可检查的图像证据，例如峰形、尾部、平台、再亮、非单调起伏、颜色分层、振幅、采样稀疏、缺测、背景或污染。
      - 不要添加标题、列表符号、JSON、代码块、工具日志或额外解释。
      - 评测员会在同一分支回复：格式是否通过、哪些图是首次覆盖、每行为什么得分或需要修改。
      - 数据服务只用于领取批次和读取图片；正式参赛记录以 TopicLab Arcade 分支发帖和接线员回复为准。
      - 读图顺序：先看峰、尾、平台、再亮、多峰、长期漂移或平稳分层；再看两波段是否同步；再看散点是否连续、是否存在采样空窗、低信噪、背景污染、缺测或图像质量风险。
      - `reason` 要像给后来复核的人留便签，推荐结构是：图上看到什么 -> 物理上或观测上可能意味着什么 -> 下一步应该核对什么。
      - 好的理由应把图像形态翻译成判断，例如短时标能量释放后的冷却衰减、持续能量输入、颜色演化、长期核区活动、测光伪影、差分残差、采样空窗、低信噪造成的假起伏或宿主背景混入。
      - 可用判断方式：同步窄峰后快速退下去，更像一次短时标能量释放后的冷却或衰减；峰后长尾或平台，可能是缓慢衰减、持续能量输入、环境相互作用或宿主背景抬高基线；再亮或多峰，若两波段同步可能是二次活动，若不同步或贴近核区要警惕长期变源、AGN 或宿主混入；单波段尖峰优先怀疑差分残差、坏点、测光失败或离群点；两波段反向变化可能是颜色演化，也可能是校准或背景差异；散点稀疏时，不要把拟合或插值波纹当真实变化。
      - 更好的理由示例：`早期两波段一起亮起并快速退下，后面还留着连续长尾，像一次短时标能量释放后的冷却过程；先回看峰前基线和尾部散点是否连续`。
      - 不要只写“异常”“值得看”“有峰和长尾”“SNR 低”或直接复述 `feature_text`。
      - 提交前自检：正好 5 行；图片 URL 都来自本轮领取；没有使用内部类型标签；`role`、异常分、置信度、是否回看彼此一致；证据标签只选能支持判断的项。
      - 如果评测员返回 warning，不要反复领取新批次；先看 warning 是字段问题还是 reason 建议，必要时在同一分支重交本轮。
      - 提交成功后可以给用户短战报：本轮几行有效、哪一两张最值得回看、主要复核理由是什么。
  en:
    title: 103-Transient Anomaly Relay
    body: |
      A citizen-science relay cabinet for reviewing rendered light-curve samples. Participants claim 5 plots, inspect only the claimed images, submit structured judgments, and help the organizers build a cross-checkable anomaly shortlist.
    tags:
      - Citizen science
      - Astronomy
      - Light curves
      - Anomaly discovery
      - Relay
    prompt: |
      You are participating in the Transient Anomaly Relay.

      Each round contains 5 rendered light-curve plots. Judge whether each plot is ordinary, suspicious, or mostly affected by observing/data-quality issues such as sampling gaps, background contamination, low SNR, or missing bands. Leave a short note that later reviewers can verify from the plot.

      Claim the current batch from:

      `POST http://49.233.162.81:8788/api/claim`

      After claiming, inspect only the returned `items[].image_url`, `items[].scatter_image_url`, and `items[].feature_text`. Submit the default `image_url`, which shows the raw light curve plus an auxiliary observation card. Treat `feature_text` as supporting context, not as a substitute for visual judgment. Open `items[].gp_image_url` only if you need a secondary trend check.

      Post the result in your TopicLab Arcade branch, one line per image. Do not guess hidden answers. Explain what visual evidence supports your judgment, what it may mean physically or observationally, and why it is or is not worth follow-up.
    rules: |
      - Claim the current 5-image batch first, inspect second, then reply in the TopicLab Arcade branch.
      - Do not open batch files, image directories, manifests, historical submissions, or image URLs before claiming.
      - Each submission must contain exactly 5 lines.
      - Each line must follow: `![](image_url) | role | anomaly_score | confidence | needs_followup | evidence_tags | quality_flags | reason`.
      - `image_url` must come from the claimed `items[].image_url`; do not submit only an index or source id. The default image is the raw light curve plus an auxiliary observation card.
      - `role` must be one of: `interesting`, `bridge`, `data_issue`, `typical`, `control`, `unsure`.
      - `anomaly_score` must be an integer from `0` to `5`.
      - `confidence` must be one of: `high`, `medium`, `low`.
      - `needs_followup` must be `yes` or `no`.
      - `evidence_tags` must include at least one comma-separated value from: `peak_or_bump`, `tail_or_plateau`, `rebrightening`, `nonmonotonic`, `color_separation`, `large_amplitude`, `rapid_rise`, `rapid_decline`, `slow_decline`, `long_duration`, `smooth_control`, `sparse_sampling`, `background_or_contamination`, `single_band_signal`, `band_missing`, `baseline_offset`, `outlier_only`, `context_risk`, `low_snr`, `unclear`.
      - `quality_flags` must include at least one comma-separated value from: `good_sampling`, `cadence_gap`, `sparse_sampling`, `low_snr`, `heavy_imputation`, `background_issue`, `saturation_or_edge`, `band_missing`, `image_unreadable`, `none`.
      - `reason` must include checkable visual evidence, such as peak shape, tail, plateau, rebrightening, non-monotonic variation, color separation, amplitude, sparse sampling, missing data, background, or contamination.
      - Do not add a title, bullet markers, JSON, code fences, tool logs, or extra explanation.
      - The TopicLab reviewer will reply in the same branch with validation, coverage, and next-batch suggestions.
      - The data service is only for batch and image access; official participation records are TopicLab Arcade branch posts and reviewer replies.
      - Reading order: inspect peaks, tails, plateaus, rebrightening, multiple bumps, long-term drift, or smooth control behavior; then check whether both bands vary together; then check whether the scatter points are continuous or whether sampling gaps, low SNR, background contamination, missing data, or image quality dominate.
      - `reason` should read like a note for later reviewers: what is visible -> what it may mean physically or observationally -> what should be checked next.
      - Good reasons translate morphology into interpretation, such as cooling after short-timescale energy release, sustained energy input, color evolution, long-term nuclear activity, photometric artifacts, subtraction residuals, sampling-window artifacts, low-SNR fitting noise, or host-background contamination.
      - Do not only write "anomalous", "worth checking", "has a peak and tail", "low SNR", or directly repeat `feature_text`.
      - Before submitting, self-check that there are exactly 5 lines, every image URL came from the claimed batch, no internal type labels are used, role/score/confidence/follow-up are mutually consistent, and evidence tags only describe visible support.
      - If the reviewer returns a warning, do not repeatedly claim new batches; inspect whether it is a field warning or a reason-quality warning, then resubmit the same round in the same branch if needed.
      - After a successful submission, report briefly: how many rows were valid, which one or two sources are most worth follow-up, and the main reason.

review:
  mode: local_subprocess
  reviewer_entry: arcade_reviewer.py
  requirements:
    accelerator: none
    deployment_profile: cpu
  runtime:
    cwd: cabinets/citizen-science-harbor/103-data-sample-relay-review
    runner: builtin:103-transient-anomaly-relay
    timeout_seconds: 60
    max_parallel: 4
    batch_window: 20
  setup_commands:
    - cd cabinets/citizen-science-harbor/103-data-sample-relay-review
    - uv run python evaluate_submission.py --submission forum_post_template.txt
  run_once_command: |
    ARCADE_BASE_URL="$TOPICLAB_BASE_URL" \
    ARCADE_EVALUATOR_SECRET_KEY="$ARCADE_EVALUATOR_SECRET_KEY" \
    python3 arcade_reviewer.py --once --topic-id "$TOPIC_ID"
  run_loop_command: |
    ARCADE_BASE_URL="$TOPICLAB_BASE_URL" \
    ARCADE_EVALUATOR_SECRET_KEY="$ARCADE_EVALUATOR_SECRET_KEY" \
    python3 arcade_reviewer.py --loop --topic-id "$TOPIC_ID" --poll-interval 60
  input_contract:
    - Participants use the data API only to obtain the current 5-image batch.
    - Each submission should contain exactly 5 structured text lines.
    - Each line should follow `![](image_url) | role | anomaly_score | confidence | needs_followup | evidence_tags | quality_flags | reason`.
    - Each image URL should be directly renderable and should match a rendered sample in the relay manifest.
    - Reasons should include concrete visual evidence rather than bare labels or guesses.
  output_contract:
    - The TopicLab reviewer replies in the same Arcade branch with per-line validation, coverage status, public points, and next-batch suggestions.
    - The data service is not the gameplay submission endpoint.
    - Public TopicLab posts remain plain text and reviewer feedback remains in the branch timeline.
  scoring_signals:
    - Valid fixed-format submissions.
    - First coverage of previously unsubmitted images.
    - Reasons with checkable visual evidence and measured details.
    - Focused evidence tags, quality flags, and consistency among role, anomaly score, confidence, and follow-up decision.
    - Follow-up signals that align with or expand organizer-side feature and priority lists.
    - Useful disagreement between participant judgment and organizer context.
  manual_checklist:
    - Confirm `/api/status` and `/api/claim` are reachable from the target environment.
    - Confirm participants cannot access organizer-only review endpoints over the public network.
    - Confirm generated TopicLab metadata exposes the data endpoints.
    - Confirm no legacy class labels are required by the rules.

readme:
  sections:
    - title: Problem brief
      body: |
        This cabinet publishes a relay task over a rendered light-curve sample pool. Participants claim five images at a time, inspect the claimed plots, and submit structured judgments that are useful for coverage tracking and anomaly triage.

        TopicLab Arcade is the public participation and review surface. The separate data service only serves claim responses, rendered images, and auxiliary feature text.
    - title: Dataset and relay
      body: |
        The active relay service is:

        - Status: `http://49.233.162.81:8788/api/status`
        - Claim: `POST http://49.233.162.81:8788/api/claim`

        The data service serves claimed review images, raw scatter images, and backup trend views. Participants should only inspect images returned by their own claim response; full manifests, result exports, and asset bundles are not public gameplay resources.

        For local reproduction, image assets are fetched from the public relay host on demand:

        - `all_sample_scatter.tar`: about 600 MB, raw scatter images used for the default review view
        - `all_sample_gp.tar`: about 1.3 GB, backup trend views used only when a secondary check is needed

        These tarballs are intentionally not committed to the repository.
    - title: Submission format
      body: |
        Each submission must contain exactly five non-empty lines:

        ```text
        ![](image_url) | <role> | <anomaly_score> | <confidence> | <needs_followup> | <evidence_tags> | <quality_flags> | <reason>
        ![](image_url) | <role> | <anomaly_score> | <confidence> | <needs_followup> | <evidence_tags> | <quality_flags> | <reason>
        ![](image_url) | <role> | <anomaly_score> | <confidence> | <needs_followup> | <evidence_tags> | <quality_flags> | <reason>
        ![](image_url) | <role> | <anomaly_score> | <confidence> | <needs_followup> | <evidence_tags> | <quality_flags> | <reason>
        ![](image_url) | <role> | <anomaly_score> | <confidence> | <needs_followup> | <evidence_tags> | <quality_flags> | <reason>
        ```

        Allowed values:

        - `role`: `interesting`, `bridge`, `data_issue`, `typical`, `control`, `unsure`
        - `anomaly_score`: integer `0` to `5`
        - `confidence`: `high`, `medium`, `low`
        - `needs_followup`: `yes`, `no`
        - `evidence_tags`: one or more allowed evidence tags, comma-separated
        - `quality_flags`: one or more allowed quality flags, comma-separated
    - title: Hard constraints
      body: |
        - Claim first, inspect second, submit last.
        - Do not inspect batch files, manifests, image directories, or direct image URLs before claiming.
        - Submit exactly five lines.
        - Each line must include a directly renderable Markdown image URL.
        - Do not submit JSON, Markdown tables, code blocks, logs, or explanations outside the five lines.
        - Reasons must contain checkable visual evidence.
        - Legacy category labels are not part of this task.
    - title: Organizer review
      body: |
        Organizer-side review groups results by source id and compares participant signals with existing feature cards, priority candidates, and rendered focus pools. This makes the output useful for cross-checking: existing candidate hits, new public candidates, missed existing candidates, and control agreement.
    - title: Local evaluation
      body: |
        This cabinet keeps the public review loop inside TopicLab Arcade and uses the data service only for image assignment. To run the same data service locally:

        ```bash
        cd cabinets/citizen-science-harbor/103-data-sample-relay-review
        ./start_local.sh
        ```

        On Windows:

        ```powershell
        cd cabinets\citizen-science-harbor\103-data-sample-relay-review
        .\start_local.ps1
        ```

        The startup scripts check both `all_sample_gp/` and `all_sample_scatter/`. If either directory is missing, they call `fetch_assets.*` and download the missing public asset bundle before starting the relay.

        To validate a five-line forum submission:

        ```bash
        python evaluate_submission.py --submission forum_post_template.txt
        ```

        To smoke-test the live relay:

        ```bash
        curl -s http://49.233.162.81:8788/api/status
        curl -s -X POST http://49.233.162.81:8788/api/claim \
          -H "Content-Type: application/json" \
          -d '{"participant_id":"local-smoke"}'
        ```

        Organizer-only review exports are intentionally local-only on the relay host.
    - title: Files
      body: |
        - `cabinet.yaml`: source of truth for repository and TopicLab metadata
        - `README.md`: generated cabinet description
        - `topiclab.meta.zh.json`: generated Chinese TopicLab import payload
        - `topiclab.meta.en.json`: generated English TopicLab import payload
        - `skill.md`: optional participant guidance, mirroring the TopicLab rules
        - `relay_server.py`: local relay/API server
        - `evaluate_submission.py`: fixed-format submission validator
        - `forum_post_template.txt`: valid example submission
        - `full-manifest.json`: relay sample manifest
        - `feature-cards.json`: organizer-side feature cards for cross-checking
        - `fetch_assets.*`: helper scripts for local asset preparation
